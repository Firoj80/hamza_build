    <path d="M212 133 L780 95" stroke="#e2e0d2" stroke-width="1.5"/>
    <path d="M220 138 L788 100" stroke="#dcd9ca" stroke-width="1.5"/>
    <path d="M774 90 L798 104 L798 914 L774 902 Z" fill="#eae8da"/>

    <!-- Book Spine (Left 3D Bevel) -->
