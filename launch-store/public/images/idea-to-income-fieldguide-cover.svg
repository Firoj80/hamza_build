        <text x="20" y="26" fill="#d9f45b" font-family="'Manrope', 'Liberation Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">ALSO INCLUDED IN PAGES 05–07 OF THE FIELDGUIDE</text>

