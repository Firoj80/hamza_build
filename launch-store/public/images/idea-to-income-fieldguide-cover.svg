        <circle cx="16" cy="28" r="16" fill="#d9f45b"/>
        <text x="16" y="34" text-anchor="middle" fill="#102b23" font-family="Georgia, 'Liberation Serif', serif" font-size="16" font-weight="700">hi.</text>
        <text x="44" y="24" fill="#f9f8f4" font-family="'Manrope', 'Liberation Sans', sans-serif" font-size="12.5" font-weight="700">A clear starting point for first-time creators.</text>
        <text x="44" y="42" fill="#9bb3a3" font-family="'DM Sans', 'Liberation Sans', sans-serif" font-size="12">No sales or income promises · Online library reader</text>
      </g>
    </g>
