    <line x1="212" y1="143" x2="212" y2="955" stroke="#d9f45b" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Main Front Hardcover Board -->
    <path d="M224 142 L794 102 L794 918 L224 958 Z" fill="url(#bookCover)"/>

    <!-- Inner Foil Frame -->
    <path d="M250 168 L768 132 L768 890 L250 926 Z" stroke="#d9f45b" stroke-opacity="0.24" stroke-width="1.5" fill="none"/>

