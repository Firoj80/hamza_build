<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" fill="none">
  <defs>
    <!-- Studio Backdrop Gradients -->
    <linearGradient id="bgStone" x1="0" y1="0" x2="1600" y2="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3f5ec"/>
      <stop offset="50%" stop-color="#e5ead9"/>
      <stop offset="100%" stop-color="#d4ddc7"/>
    </linearGradient>
    <radialGradient id="sunBeam" cx="0.20" cy="0.16" r="0.78">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#f7f9ef" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d4ddc7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="limeGlow" cx="0.35" cy="0.52" r="0.46">
      <stop offset="0%" stop-color="#d9f45b" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#d9f45b" stop-opacity="0"/>
    </radialGradient>

    <!-- Hardcover Book Gradients -->
    <linearGradient id="bookCover" x1="210" y1="100" x2="820" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d493d"/>
      <stop offset="48%" stop-color="#15382e"/>
      <stop offset="100%" stop-color="#0b221b"/>
    </linearGradient>
    <linearGradient id="bookSpine" x1="170" y1="130" x2="225" y2="955" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c241d"/>
      <stop offset="50%" stop-color="#194135"/>
      <stop offset="100%" stop-color="#071712"/>
    </linearGradient>
    <linearGradient id="goldLime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7fa87"/>
      <stop offset="55%" stop-color="#d9f45b"/>
      <stop offset="100%" stop-color="#b5cf49"/>
    </linearGradient>
    <linearGradient id="sheetPaper" x1="820" y1="120" x2="1500" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffefb"/>
      <stop offset="100%" stop-color="#f5f4ea"/>
    </linearGradient>

    <!-- Elevation Shadows -->
    <filter id="bookShadow" x="-15%" y="-10%" width="140%" height="135%">
