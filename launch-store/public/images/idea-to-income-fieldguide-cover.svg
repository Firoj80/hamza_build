        <rect x="62" y="168" width="212" height="30" rx="5" fill="#163b30" stroke="#31614f" stroke-width="1"/>
        <text x="74" y="188" fill="#d9f45b" font-family="'Manrope', 'Liberation Sans', sans-serif" font-size="12" font-weight="800">01</text>
        <text x="98" y="188" fill="#f4f6ee" font-family="'DM Sans', 'Liberation Sans', sans-serif" font-size="13" font-weight="700">Choose a real problem</text>

        <!-- Milestone 02 -->
