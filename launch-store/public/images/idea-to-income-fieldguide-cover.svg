    <text x="1536" y="56" text-anchor="end">IDEA-TO-INCOME FIELDGUIDE · $5 USD ONE-TIME</text>
  </g>
  <line x1="64" y1="74" x2="1536" y2="74" stroke="#173b31" stroke-opacity="0.14" stroke-width="1"/>

