  <line x1="0" y1="845" x2="1600" y2="775" stroke="#bdc8ad" stroke-width="1.5"/>

  <!-- Top Authentic Product Metadata Bar -->
  <g fill="#4f604d" font-family="'Manrope', 'DM Sans', 'Liberation Sans', sans-serif" font-size="12.5" font-weight="800" letter-spacing="2.2">
