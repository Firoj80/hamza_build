      <g transform="translate(0, 254)">
        <rect x="0" y="0" width="466" height="226" rx="8" fill="#0c221b" fill-opacity="0.6" stroke="#2c5949" stroke-width="1.2"/>
        <line x1="0" y1="75" x2="466" y2="75" stroke="#23493c" stroke-dasharray="4 6"/>
        <line x1="0" y1="150" x2="466" y2="150" stroke="#23493c" stroke-dasharray="4 6"/>

