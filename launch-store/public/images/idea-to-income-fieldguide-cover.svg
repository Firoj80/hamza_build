      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#132c23" flood-opacity="0.10"/>
    </filter>

    <pattern id="archGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#173b31" stroke-width="1" stroke-opacity="0.05"/>
    </pattern>
