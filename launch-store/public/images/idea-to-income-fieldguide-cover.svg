        <text x="44" y="107">How much time or money does the current process take?</text>

        <rect x="0" y="126" width="643" height="36" rx="5" fill="#f4f6ed" stroke="#dfe5d4"/>
        <text x="14" y="149" fill="#5e7d37" font-family="'Manrope', 'Liberation Sans', sans-serif" font-weight="800">Q4</text>
        <text x="44" y="149">What have you tried or paid for already?</text>

        <rect x="0" y="168" width="643" height="36" rx="5" fill="#f4f6ed" stroke="#dfe5d4"/>
        <text x="14" y="191" fill="#5e7d37" font-family="'Manrope', 'Liberation Sans', sans-serif" font-weight="800">Q5</text>
