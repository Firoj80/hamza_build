    <rect x="0" y="0" width="715" height="448" rx="10" fill="url(#sheetPaper)" stroke="#cfd8c2" stroke-width="1.5"/>
    <path d="M 0 10 Q 0 0 10 0 L 705 0 Q 715 0 715 10 L 715 12 L 0 12 Z" fill="#6e8c42"/>

    <g transform="translate(36, 36)">
