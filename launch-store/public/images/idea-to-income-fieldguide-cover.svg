      <g transform="translate(0, 78)">
        <rect x="0" y="0" width="623" height="122" rx="7" fill="#eef3e3" stroke="#cad8b4" stroke-width="1.2"/>
        <text x="18" y="24" fill="#284e33" font-family="'Manrope', 'Liberation Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="1.4">WORKED EXAMPLE / TUTOR WORKSHEET KIT</text>
        <text x="18" y="48" fill="#173b31" font-family="'DM Sans', 'Liberation Sans', sans-serif" font-size="13.5"><tspan font-weight="700">Audience:</tspan> Independent English tutors preparing beginner lessons.</text>
        <text x="18" y="72" fill="#173b31" font-family="'DM Sans', 'Liberation Sans', sans-serif" font-size="13.5"><tspan font-weight="700">Recurring task:</tspan> Formatting weekly practice worksheets takes time.</text>
        <text x="18" y="96" fill="#173b31" font-family="'DM Sans', 'Liberation Sans', sans-serif" font-size="13.5"><tspan font-weight="700">Small first resource:</tspan> One editable worksheet + completed example &amp; instructions.</text>
