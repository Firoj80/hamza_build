  <!-- Background Canvas -->
  <rect width="1600" height="1100" fill="url(#bgStone)"/>
  <rect width="1600" height="1100" fill="url(#sunBeam)"/>
  <rect width="1600" height="1100" fill="url(#archGrid)"/>
  <rect width="1600" height="1100" fill="url(#limeGlow)"/>

