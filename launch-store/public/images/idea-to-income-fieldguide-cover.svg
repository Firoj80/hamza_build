        <g transform="translate(0, 26)" font-family="'DM Sans', 'Liberation Sans', sans-serif" font-size="13" fill="#4f5e4d">
          <text x="0" y="16" font-weight="600">My audience is:</text>
          <line x1="190" y1="16" x2="623" y2="16" stroke="#c8d1bc" stroke-width="1.5"/>
          <text x="0" y="44" font-weight="600">They struggle with this recurring task:</text>
          <line x1="250" y1="44" x2="623" y2="44" stroke="#c8d1bc" stroke-width="1.5"/>
          <text x="0" y="72" font-weight="600">Their current workaround is:</text>
          <line x1="195" y1="72" x2="623" y2="72" stroke="#c8d1bc" stroke-width="1.5"/>
          <text x="0" y="100" font-weight="600">My resource helps them produce:</text>
          <line x1="220" y1="100" x2="623" y2="100" stroke="#c8d1bc" stroke-width="1.5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- SHEET B (BOTTOM RIGHT): Page 04 "02 / RESEARCH" Five Useful Questions + Page 05 Prompts -->
