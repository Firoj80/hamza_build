        <text x="14" y="23" fill="#5e7d37" font-family="'Manrope', 'Liberation Sans', sans-serif" font-weight="800">Q1</text>
        <text x="44" y="23">When did this problem last happen? Walk me through it.</text>

        <rect x="0" y="42" width="643" height="36" rx="5" fill="#f4f6ed" stroke="#dfe5d4"/>
        <text x="14" y="65" fill="#5e7d37" font-family="'Manrope', 'Liberation Sans', sans-serif" font-weight="800">Q2</text>
        <text x="44" y="65">How do you solve it now, and what is frustrating about that?</text>

