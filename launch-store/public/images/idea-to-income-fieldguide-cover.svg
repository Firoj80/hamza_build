      <circle cx="16" cy="15" r="4" fill="#d9f45b"/>
      <text x="28" y="19" fill="#d9f45b" font-family="'Manrope', 'Liberation Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="1.8">HAMZA IDRISHI / BUILD_HAMZA</text>
      <text x="466" y="19" text-anchor="end" fill="#a8bfb1" font-family="'Manrope', 'Liberation Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">$5 · 7-PAGE GUIDE</text>

      <!-- Exact Product Title -->
