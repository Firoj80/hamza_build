        <rect x="148" y="68" width="224" height="30" rx="5" fill="#163b30" stroke="#31614f" stroke-width="1"/>
        <text x="160" y="88" fill="#d9f45b" font-family="'Manrope', 'Liberation Sans', sans-serif" font-size="12" font-weight="800">02</text>
        <text x="184" y="88" fill="#f4f6ee" font-family="'DM Sans', 'Liberation Sans', sans-serif" font-size="13" font-weight="700">Talk to potential users</text>

        <!-- Milestone 03 -->
