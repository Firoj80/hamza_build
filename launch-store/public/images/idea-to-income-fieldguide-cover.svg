        <text x="232" y="40" fill="#0d261f" font-family="'Manrope', 'Liberation Sans', sans-serif" font-size="12" font-weight="800">03</text>
        <text x="256" y="40" fill="#0d261f" font-family="'Manrope', 'Liberation Sans', sans-serif" font-size="13" font-weight="800">Test a small launch</text>
